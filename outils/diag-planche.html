<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Formes d'une planche</title>
<style>
  body { font: 14px Nunito, sans-serif; background: #FFF8F0; color: #3A3440; margin: 12px; }
  h3 { margin: 0 0 10px; color: #7B3FD3; }
  .g { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .c { background: #fff; border-radius: 10px; padding: 6px; text-align: center;
       box-shadow: 0 2px 6px rgba(58,52,64,.1); }
  .c svg { width: 100%; height: 96px; display: block; color: #3A3440; }
  .c b { color: #D9487E; font-size: 15px; }
  .c span { display: block; font-size: 10.5px; color: #6B6474; }
</style>
</head>
<body>
<h3 id="t">…</h3>
<div class="g" id="g"></div>

<script src="../app/subpaths.js"></script>
<script src="../app/planches.js"></script>
<script>
var quelle = new URLSearchParams(location.search).get('p') || '1v1';
var subs = SubPaths.split(PLANCHES[quelle]);
document.getElementById('t').textContent =
  'Planche « ' + quelle +' » — ' + subs.length + ' morceaux';

var NS = 'http://www.w3.org/2000/svg';
var sonde = document.createElementNS(NS, 'svg');
sonde.setAttribute('width', '210'); sonde.setAttribute('height', '297');
sonde.style.cssText = 'position:absolute;left:-9999px';
document.body.appendChild(sonde);

var g = document.getElementById('g');
subs.forEach(function (d, i) {
  var p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d);
  sonde.appendChild(p);
  var bb = p.getBBox();
  sonde.removeChild(p);
  var m = Math.max(bb.width, bb.height) * 0.08 + 0.5;
  var vb = [bb.x - m, bb.y - m, bb.width + 2 * m, bb.height + 2 * m].join(' ');
  var c = document.createElement('div');
  c.className = 'c';
  c.innerHTML = '<svg viewBox="' + vb + '"><path d="' + d + '" fill="currentColor"/></svg>'
    + '<b>' + i + '</b>'
    + '<span>' + bb.width.toFixed(1) + ' x ' + bb.height.toFixed(1) + ' mm</span>'
    + '<span>en ' + bb.x.toFixed(0) + ',' + bb.y.toFixed(0) + '</span>';
  g.appendChild(c);
});
</script>
</body>
</html>
