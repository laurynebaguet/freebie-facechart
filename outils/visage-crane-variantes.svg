  <rect width="540" height="250" fill="#FFF8F0"/>
  <g font-family="Verdana, sans-serif">
    <text x="16" y="24" font-size="13" font-weight="bold" fill="#3A3440">Visage du cr&#226;ne &#8212; quelle version ?</text>
    <text x="16" y="40" font-size="9.5" fill="#7B3FD3">Le cr&#226;ne est en gris, le visage en noir. Taille r&#233;elle du cr&#226;ne : 18,5 &#215; 15,4 mm.</text>

    <!-- A : version actuelle -->
