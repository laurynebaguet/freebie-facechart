    <text x="206" y="206" font-size="11" font-weight="bold" fill="#D9487E" text-anchor="middle">B</text>
    <text x="206" y="220" font-size="9" fill="#3A3440" text-anchor="middle">yeux redress&#233;s</text>
    <text x="206" y="232" font-size="9" fill="#6B6474" text-anchor="middle">amandes &#224; l&#8217;horizontale</text>

    <!-- C : yeux echanges -->
