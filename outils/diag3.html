<!doctype html><meta charset="utf-8"><title>Reperage des bandes</title>
<style>
  body { font: 13px sans-serif; background: #fff; margin: 10px; }
  svg { width: 620px; height: auto; border: 1px solid #ccc; }
  .g { stroke: #bbb; stroke-width: .15; }
  .g5 { stroke: #f0a; stroke-width: .25; }
  .t { font: 2.4px sans-serif; fill: #d0006f; }
</style>
<div id="sortie"></div>
<script src="subpaths.js"></script>
<script>
fetch('av1.d.txt').then(function (r) { return r.text(); }).then(function (d) {
  var subs = SubPaths.split(d.trim());
  var contour = subs[0];
  var NS = 'http://www.w3.org/2000/svg';
  var x0 = 50, y0 = 30, x1 = 180, y1 = 210;

  var g = '';
  for (var x = x0; x <= x1; x += 5) {
    g += '<line class="' + (x % 20 === 0 ? 'g5' : 'g') + '" x1="' + x + '" y1="' + y0 +
         '" x2="' + x + '" y2="' + y1 + '"/>';
    if (x % 10 === 0) g += '<text class="t" x="' + (x + .4) + '" y="' + (y0 + 3) + '">' + x + '</text>';
  }
  for (var y = y0; y <= y1; y += 5) {
    g += '<line class="' + (y % 20 === 0 ? 'g5' : 'g') + '" x1="' + x0 + '" y1="' + y +
         '" x2="' + x1 + '" y2="' + y + '"/>';
    if (y % 10 === 0) g += '<text class="t" x="' + (x0 + .4) + '" y="' + (y - .6) + '">' + y + '</text>';
  }

  document.getElementById('sortie').innerHTML =
    '<svg viewBox="' + [x0, y0, x1 - x0, y1 - y0].join(' ') + '" xmlns="' + NS + '">' +
      '<path d="' + contour + '" fill="#3A3440"/>' + g +
    '</svg>' +
    '<p>Contour de la planche (sous-chemin 0), grille de 5 mm, reperes tous les 10 mm.</p>';
});
</script>
