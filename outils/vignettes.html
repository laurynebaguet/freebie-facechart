<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Les formes en grand</title>
<style>
  body { font: 15px Nunito, sans-serif; background: #FFF8F0; color: #3A3440; margin: 16px; }
  h2 { color: #7B3FD3; margin: 0 0 4px; }
  p.sous { color: #6B6474; margin: 0 0 16px; }
  .g { display: flex; gap: 14px; flex-wrap: wrap; }
  .c { background: #fff; border-radius: 12px; padding: 10px;
       box-shadow: 0 2px 10px rgba(58,52,64,.12); }
  .c canvas { display: block; background: #E8C0A0; border-radius: 8px; }
  .c b { display: block; text-align: center; margin-top: 7px; }
  .c span { display: block; text-align: center; font-size: 12px; color: #6B6474; }
</style>
</head>
<body>
<h2 id="t">…</h2>
<p class="sous">Les motifs sont posés sur un fond couleur peau, à taille comparable.</p>
<div class="g" id="g"></div>

<script src="../vendor/react.production.min.js"></script>
<script src="../app/subpaths.js"></script>
<script src="../app/planches.js"></script>
<script src="../app/donnees.js"></script>
<script src="../app/formes.js"></script>
<script src="../app/rendu.js"></script>
<script>
var quelle = new URLSearchParams(location.search).get('p') || '1v1';
Formes.init();
var set = Formes.sets().filter(function (s) { return s.id === quelle; })[0];
document.getElementById('t').textContent = set.nom + ' — ' + set.formes.length + ' tampons';

function couleurDe(id) {
  for (var i = 0; i < COULEURS.length; i++) if (COULEURS[i].id === id) return COULEURS[i].hex;
  return '#000';
}
var g = document.getElementById('g');
set.formes.forEach(function (f) {
  var d = document.createElement('div');
  d.className = 'c';
  var CASE = 230;
  var c = document.createElement('canvas');
  c.width = CASE; c.height = CASE;
  var ctx = c.getContext('2d');
  var t = document.createElement('canvas');
  t.width = CASE; t.height = CASE;
  // chaque motif est mis à l'échelle pour occuper la case
  var e = (CASE - 26) / Math.max(f.largeurMm, f.hauteurMm);
  var el = { id: 1, type: 'forme', setId: set.id, formeId: f.id,
             couleurId: 'noir', x: 0, y: 0, rot: 0, zoom: 1, gommes: [] };
  ctx.save();
  ctx.translate(CASE / 2, CASE / 2);
  Rendu.maquillage(ctx, { elements: [el] }, e, couleurDe, null, t);
  ctx.restore();
  d.appendChild(c);
  var b = document.createElement('b'); b.textContent = f.nom; d.appendChild(b);
  var s = document.createElement('span');
  s.textContent = f.largeurMm.toFixed(0) + ' × ' + f.hauteurMm.toFixed(0) + ' mm';
  d.appendChild(s);
  g.appendChild(d);
});
</script>
</body>
</html>
